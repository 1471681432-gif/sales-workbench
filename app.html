<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff6b9d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="销售工作台">
<meta name="application-name" content="销售工作台">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>运动场材料销售 · 工作台</title>
<style>
  :root{
    --brand:#ff6b9d;--brand-deep:#e8438a;--brand-soft:#ffe5f0;
    --ink:#0f172a;--ink-2:#334155;--muted:#64748b;--line:#e2e8f0;
    --bg:#f1f5f9;--card:#ffffff;
    --green:#16a34a;--green-soft:#dcfce7;
    --amber:#d97706;--amber-soft:#fef3c7;
    --red:#dc2626;--red-soft:#fee2e2;
    --purple:#7c3aed;--purple-soft:#ede9fe;
    --shadow:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
    --shadow-lg:0 10px 30px -10px rgba(15,23,42,.15);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overscroll-behavior:none;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;padding-bottom:70px;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:15px;}
  input,select,textarea{font-family:inherit;font-size:15px;}

  /* ===== 顶部 ===== */
  .topbar{
    position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#0f172a,#1e293b);
    color:#fff;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));
    display:flex;align-items:center;justify-content:space-between;
  }
  .topbar-left{display:flex;align-items:center;gap:10px;}
  .topbar-brand{font-weight:700;font-size:17px;}
  .topbar-sub{font-size:11px;color:#94a3b8;}
  .topbar-actions{display:flex;gap:8px;}
  .topbar-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;}

  /* ===== 统计条 ===== */
  .stats-bar{display:flex;padding:12px 16px;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .stats-bar::-webkit-scrollbar{display:none;}
  .stat-chip{flex-shrink:0;background:var(--card);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);min-width:80px;text-align:center;}
  .stat-chip .sc-val{font-size:20px;font-weight:700;color:var(--brand);}
  .stat-chip .sc-label{font-size:11px;color:var(--muted);margin-top:2px;}

  /* ===== 内容区 ===== */
  .content{padding:0 12px 20px;min-height:60vh;}

  /* ===== Tab 页面 ===== */
  .page{display:none;}
  .page.active{display:block;}

  /* ===== 卡片 ===== */
  .card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
  .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .card-title{font-size:16px;font-weight:600;margin:0;}

  /* ===== 今日任务卡片 ===== */
  .task-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start;}
  .task-item:last-child{border-bottom:none;}
  .task-prio{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:6px;}
  .task-body{flex:1;min-width:0;}
  .task-body .task-title{font-weight:600;font-size:15px;margin-bottom:2px;}
  .task-body .task-meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;}
  .task-body .task-note{font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.4;}
  .task-actions{display:flex;gap:6px;flex-shrink:0;flex-direction:column;align-items:flex-end;}
  .task-done{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;transition:all .15s;}
  .task-done:active{background:var(--green);border-color:var(--green);color:#fff;}

  /* ===== 项目卡片 ===== */
  .project-card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);border-left:4px solid var(--brand);cursor:pointer;}
  .project-card .pc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .project-card .pc-name{font-weight:600;font-size:15px;}
  .project-card .pc-customer{font-size:13px;color:var(--muted);}
  .project-card .pc-row{display:flex;gap:12px;font-size:13px;color:var(--ink-2);margin-top:6px;flex-wrap:wrap;}
  .project-card .pc-row span{display:flex;align-items:center;gap:4px;}

  /* ===== 快速操作按钮 ===== */
  .quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
  .quick-btn{background:var(--card);border-radius:12px;padding:14px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:all .15s;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;}
  .quick-btn:active{background:var(--brand-soft);transform:scale(.97);}
  .quick-btn .qb-ico{font-size:22px;}

  /* ===== 客户列表 ===== */
  .customer-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;}
  .customer-item:active{background:var(--brand-soft);}
  .cust-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;}
  .cust-info{flex:1;min-width:0;}
  .cust-info .cust-name{font-weight:600;font-size:15px;}
  .cust-info .cust-detail{font-size:12px;color:var(--muted);}
  .cust-badge{font-size:12px;font-weight:600;color:var(--brand);}

  /* ===== 快捷菜单（个人页） ===== */
  .menu-list{margin-top:4px;}
  .menu-item{display:flex;align-items:center;gap:12px;padding:14px 12px;background:var(--card);border-bottom:1px solid var(--line);cursor:pointer;font-size:15px;}
  .menu-item:first-child{border-radius:12px 12px 0 0;}
  .menu-item:last-child{border-radius:0 0 12px 12px;border-bottom:none;}
  .menu-item:active{background:var(--bg);}
  .menu-item .mi-ico{font-size:20px;width:28px;text-align:center;}

  /* ===== 搜索栏 ===== */
  .search-bar{display:flex;gap:8px;margin-bottom:12px;}
  .search-input-m{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fff;font-size:15px;}

  /* ===== 底部导航 ===== */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    display:flex;z-index:40;padding:6px 0 env(safe-area-inset-bottom);
  }
  .bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:500;transition:color .15s;}
  .bottom-nav-item.active{color:var(--brand);}
  .bottom-nav-item svg{width:24px;height:24px;}

  /* ===== Toast ===== */
  .toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s;}
  .toast.show{opacity:.95;}
  .toast.error{background:var(--red);}

  /* ===== 模态框 ===== */
  .mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:50;align-items:flex-end;justify-content:center;}
  .mask.show{display:flex;}
  .modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-height:85vh;overflow-y:auto;padding:0;animation:slideUp .25s ease;}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal-head{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;z-index:1;}
  .modal-title{font-size:17px;font-weight:700;}
  .modal-close{width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted);}
  .modal-body{padding:16px;}
  .modal-foot{padding:12px 16px 16px;display:flex;gap:8px;border-top:1px solid var(--line);}
  .modal-foot .btn{flex:1;}

  /* ===== 表单 ===== */
  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:4px;}
  .form-group input,.form-group select,.form-group textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;font-size:15px;}
  .form-group textarea{min-height:80px;resize:vertical;}

  /* ===== 按钮 ===== */
  .btn{padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-primary:active{background:var(--brand-deep);}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink-2);}
  .btn-ghost:active{background:var(--bg);}
  .btn-danger{background:var(--red-soft);color:var(--red);}
  .btn-sm{padding:7px 12px;font-size:13px;}
  .btn-block{width:100%;}

  /* ===== 标签 ===== */
  .pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;}
  .pill-stage-1{background:#e0f2fe;color:#0369a1;}.pill-stage-2{background:#ede9fe;color:#6d28d9;}
  .pill-stage-3{background:#fef3c7;color:#b45309;}.pill-stage-4{background:#ffedd5;color:#c2410c;}
  .pill-stage-5{background:#dcfce7;color:#15803d;}.pill-stage-6{background:#d1fae5;color:#047857;}
  .pill-stage-7{background:#dbeafe;color:#1d4ed8;}.pill-stage-8{background:#f1f5f9;color:#475569;}
  .pill-stage-9{background:#fee2e2;color:#b91c1c;}
  .pill-priority-high{background:var(--red-soft);color:var(--red);}
  .pill-priority-mid{background:var(--amber-soft);color:var(--amber);}

  /* ===== 空状态 ===== */
  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty-ico{font-size:40px;margin-bottom:8px;}

  /* ===== 跟进时间线 ===== */
  .timeline{padding:4px 0;}
  .tl-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .tl-dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex-shrink:0;margin-top:6px;}
  .tl-body{flex:1;}
  .tl-body .tl-head{font-size:13px;color:var(--muted);margin-bottom:2px;}
  .tl-body .tl-content{font-size:14px;line-height:1.5;}
</style>
</head>
<body>

<!-- 顶部栏 -->
<div class="topbar">
  <div class="topbar-left">
    <div>
      <div class="topbar-brand">运动场销售工作台</div>
      <div class="topbar-sub" id="topDate"></div>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="topbar-btn" onclick="go('me')">⚙️</button>
  </div>
</div>

<!-- 统计滚动条 -->
<div class="stats-bar" id="statsBar"></div>

<!-- 内容区 -->
<div class="content" id="mainContent"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 模态框 -->
<div class="mask" id="mask">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="modalTitle"></span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<!-- 底部导航 -->
<nav class="bottom-nav">
  <button class="bottom-nav-item active" data-tab="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>首页</span>
  </button>
  <button class="bottom-nav-item" data-tab="projects">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    <span>项目</span>
  </button>
  <button class="bottom-nav-item" data-tab="followup">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span>跟进</span>
  </button>
  <button class="bottom-nav-item" data-tab="customers">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>客户</span>
  </button>
  <button class="bottom-nav-item" data-tab="me">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>我</span>
  </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="shared.js?v=3"></script>
<script>
/* ========== Tab 路由 ========== */
let currentTab='home';

document.getElementById('topDate').textContent=todayStr()+' 星期'+'日一二三四五六'[new Date().getDay()];

document.querySelectorAll('.bottom-nav-item').forEach(btn=>{
  btn.addEventListener('click',()=>go(btn.dataset.tab));
});

function go(tab){
  currentTab=tab;
  document.querySelectorAll('.bottom-nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  render();
  window.scrollTo(0,0);
}

function render(){
  updateStatsBar();
  const c=document.getElementById('mainContent');
  if(currentTab==='home')c.innerHTML=homeHtml();
  else if(currentTab==='projects')c.innerHTML=projectsMobileHtml();
  else if(currentTab==='followup')c.innerHTML=followupMobileHtml();
  else if(currentTab==='customers')c.innerHTML=customersMobileHtml();
  else if(currentTab==='me')c.innerHTML=meHtml();
}

function updateStatsBar(){
  const s=getStats();
  document.getElementById('statsBar').innerHTML=`
    <div class="stat-chip" onclick="go('projects')"><div class="sc-val">${s.total}</div><div class="sc-label">项目</div></div>
    <div class="stat-chip" onclick="go('home')"><div class="sc-val">${s.activeAlerts}</div><div class="sc-label">待办</div></div>
    <div class="stat-chip" onclick="go('projects')"><div class="sc-val">${fmtMoney(s.pendingPay)}</div><div class="sc-label">待回款</div></div>
    <div class="stat-chip"><div class="sc-val">${s.overdue}</div><div class="sc-label">逾期</div></div>
    <div class="stat-chip"><div class="sc-val">${fmtMoney(s.estCommission)}</div><div class="sc-label">预估提成</div></div>
  `;
}

/* ========== 首页 ========== */
function homeHtml(){
  const tasks=getMobileTasks();
  return `
    <div class="quick-actions">
      <div class="quick-btn" onclick="openMobileQuickFollowup()"><span class="qb-ico">📞</span>快速跟进</div>
      <div class="quick-btn" onclick="openMobileNewProject()"><span class="qb-ico">➕</span>新建项目</div>
      <div class="quick-btn" onclick="go('projects')"><span class="qb-ico">📋</span>全部项目</div>
      <div class="quick-btn" onclick="go('customers')"><span class="qb-ico">👤</span>客户列表</div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3 class="card-title">📋 今日待办</h3>
        <span style="font-size:12px;color:var(--muted)">${tasks.length} 项</span>
      </div>
      ${tasks.length?tasks.map(t=>`
        <div class="task-item" onclick="${t.source==='alert'?`openMobileAlert('${t.id}')`:`openMobileProject('${t.id}')`}">
          <div class="task-prio" style="background:${t.priority==='高'?'var(--red)':t.priority==='中'?'var(--amber)':'var(--muted)'}"></div>
          <div class="task-body">
            <div class="task-title">${escapeHtml(t.title)}</div>
            <div class="task-meta">
              <span>${t.dueLabel}</span><span>${escapeHtml(t.customer||'')}</span>
            </div>
            <div class="task-note">${escapeHtml(t.nextAction)}</div>
          </div>
          <div class="task-actions">
            <button class="task-done" onclick="event.stopPropagation();completeMobileTask('${t.source}','${t.id}')">✓</button>
          </div>
        </div>
      `).join(''):`<div class="empty"><div class="empty-ico">🎉</div>今天没有待办，保持节奏！</div>`}
    </div>

    <div class="card">
      <div class="card-header">
        <h3 class="card-title">📅 最近跟进</h3>
        <button class="btn btn-sm btn-ghost" onclick="go('followup')">全部</button>
      </div>
      ${(()=>{
        const fs=loadF().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);
        return fs.length?fs.map(f=>`
          <div class="task-item">
            <div class="task-body">
              <div class="task-title">${escapeHtml(f.customer)}</div>
              <div class="task-meta"><span>${f.date}</span><span>${f.comm}</span></div>
              <div class="task-note">${escapeHtml(f.content)}</div>
            </div>
          </div>
        `).join(''):`<div class="empty"><div class="empty-ico">💬</div>暂无跟进记录</div>`;
      })()}
    </div>
  `;
}

function getMobileTasks(){
  const ps=loadP(),als=loadAL(),t=todayStr();
  const tasks=[];
  const pr={高:0,中:1,低:2};

  als.filter(a=>!a.done).sort((a,b)=>(pr[a.priority]||0)-(pr[b.priority]||0)).forEach(a=>{
    const d=new Date(a.dueDate),now=new Date(t),diff=Math.round((d-now)/86400000);
    let dueLabel;
    if(diff<0)dueLabel='⚠️ 逾期 '+(-diff)+'天';
    else if(diff===0)dueLabel='🔥 今日到期';
    else if(diff<=3)dueLabel=diff+'天后';
    else dueLabel=diff+'天后';
    tasks.push({source:'alert',id:a.id,title:a.title,customer:a.customer,priority:a.priority,dueDate:a.dueDate,dueLabel,nextAction:a.note||'处理该任务'});
  });

  ps.filter(p=>p.nextVisit&&p.stage!=='项目完结'&&p.stage!=='丢失项目').forEach(p=>{
    const hasAlert=als.some(a=>a.projectId===p.id&&a.alertType==='客户回访'&&!a.done);
    if(hasAlert)return;
    const d=new Date(p.nextVisit),now=new Date(t),diff=Math.round((d-now)/86400000);
    let dueLabel;
    if(diff<0)dueLabel='⚠️ 逾期回访';
    else if(diff===0)dueLabel='🔥 今日回访';
    else dueLabel=diff+'天后';
    tasks.push({source:'project',id:p.id,title:'回访 '+p.name,customer:p.customer,priority:'中',dueDate:p.nextVisit,dueLabel,nextAction:`联系 ${p.contact||p.customer},商谈 ${p.stage}`});
  });

  return tasks.slice(0,10);
}

  const p=loadP().find(x=>x.id===pid);if(!p)return;
  const remain=Number(p.contract||0)-Number(p.paid||0);
  openModal('登记回款 · '+p.id,`
    <div style="margin-bottom:12px;font-size:14px">${escapeHtml(p.name)}</div>
    <div style="display:flex;gap:16px;margin-bottom:12px;font-size:13px;color:var(--muted)">

  `,`<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveMobilePayment('${pid}')">确认登记</button>`);

function saveMobilePayment(pid){
  const amt=Number(document.getElementById('mpay_amount').value||0);
  if(amt<=0){toast('请输入有效金额','error');return;}
  const ps=loadP();const i=ps.findIndex(x=>x.id===pid);
  if(i>=0){ps[i].paid=Number(ps[i].paid||0)+amt;saveP(ps);closeModal();toast(`已登记回款 ${fmtMoney(amt)}`);render();updateSyncStamp();}
}

function handleMobileImport(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{importAllData(e.target.result);render();input.value='';};
  reader.readAsText(file);
}

/* ========== Toast & Modal 覆写 ========== */
// shared.js 中的 toast/openModal/closeModal 已定义，但我们需要适应移动端布局
// 这里我们覆盖它们（shared.js 先加载，这里会覆盖）
// 实际上 shared.js 中的已经是通用的，直接可用

/* ========== 事件绑定 ========== */
// 初始化数据
seedIfEmpty();

// 搜索事件（在 render 后绑定）
let mobileEventsBound=false;
const origRender=render;
render=function(){
  origRender();
  // 绑定移动端搜索
  setTimeout(()=>{
    const kw=document.getElementById('mProjKw');
    if(kw&&!kw._bound){kw._bound=true;kw.oninput=e=>{mobileProjFilter.kw=e.target.value;render();};}
    const st=document.getElementById('mProjStage');
    if(st&&!st._bound){st._bound=true;st.onchange=e=>{mobileProjFilter.stage=e.target.value;render();};}
  },50);
};

// 初始渲染
render();

// 数据变更监听 — 当数据有变化时更新同步时间戳
const origSaveP=saveP,origSaveF=saveF,origSaveAL=saveAL,origSaveDV=saveDV,origSaveCT=saveCT;
saveP=d=>{origSaveP(d);updateSyncStamp();};
saveF=d=>{origSaveF(d);updateSyncStamp();};
saveAL=d=>{origSaveAL(d);updateSyncStamp();};
saveDV=d=>{origSaveDV(d);updateSyncStamp();};
saveCT=d=>{origSaveCT(d);updateSyncStamp();};
</script>
