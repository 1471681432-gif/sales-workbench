<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台诊断</title>
<style>
body{font-family:system-ui,sans-serif;padding:20px;background:#f1f5f9;max-width:800px;margin:0 auto}
.step{padding:12px 16px;margin:8px 0;border-radius:8px;font-size:14px}
.ok{background:#d1fae5;color:#065f46;border-left:4px solid #10b981}
.err{background:#fee2e2;color:#991b1b;border-left:4px solid #dc2626}
.warn{background:#fef3c7;color:#92400e;border-left:4px solid #f59e0b}
pre{background:#fff;padding:10px;border-radius:6px;overflow:auto;font-size:12px;margin-top:6px;max-height:200px}
h1{font-size:20px;margin-bottom:20px}
#result{margin-top:20px}
</style>
</head>
<body>
<h1>🔍 工作台诊断</h1>
<div id="result">正在检测...</div>

<script src="shared.js?v=3"></script>
<script>
const r=document.getElementById('result');
let html='';
function step(name,ok,detail){
  html+=`<div class="step ${ok?'ok':'err'}"><b>${ok?'✅':'❌'}</b> ${name}${detail?'<pre>'+detail+'</pre>':''}</div>`;
  r.innerHTML=html;
}

// Step 1: Check shared.js loaded
step('shared.js 已加载', typeof KEY_P !== 'undefined' && typeof loadP === 'function',
  'KEY_P=' + (typeof KEY_P !== 'undefined' ? KEY_P : 'undefined') + '\n' +
  'loadP=' + (typeof loadP) + '\n' +
  'fmtMoney=' + (typeof fmtMoney));

// Step 2: Check localStorage data
let storageInfo = '';
try {
  const keys = ['sw_projects','sw_followups','sw_deliveries','sw_contracts','sw_alerts','sw_pricebook','sw_scripts','sw_templates'];
  keys.forEach(k => {
    const v = localStorage.getItem(k);
    storageInfo += k + ': ' + (v ? JSON.parse(v).length + ' 条' : '空') + '\n';
  });
  step('localStorage 数据', true, storageInfo);
} catch(e) {
  step('localStorage 数据', false, e.message);
}

// Step 3: Check seedIfEmpty
try {
  seedIfEmpty();
  const ps = loadP();
  step('seedIfEmpty 执行成功', ps.length > 0, '项目数: ' + ps.length + '\n' + JSON.stringify(ps.map(p=>({id:p.id,name:p.name})),null,1));
} catch(e) {
  step('seedIfEmpty 执行成功', false, e.message + '\n' + e.stack);
}

// Step 4: Check dashboardHtml
try {
  const h = dashboardHtml();
  step('dashboardHtml 渲染成功', h.length > 100, 'HTML长度: ' + h.length + '\n前200字符:\n' + h.substring(0,200));
} catch(e) {
  step('dashboardHtml 渲染成功', false, e.message + '\n' + e.stack);
}

// Step 5: Check render
try {
  const c = document.createElement('div');
  c.id = 'pageContent';
  document.body.appendChild(c);
  render();
  step('render() 执行成功', c.innerHTML.length > 50, '渲染HTML长度: ' + c.innerHTML.length + '\n' + c.innerHTML.substring(0,200));
  c.remove();
} catch(e) {
  step('render() 执行成功', false, e.message + '\n' + e.stack);
}

// Step 6: Check functions
const funcs = ['fmtMoney','fmt2','todayStr','addDays','stagePill','rowClass','getDashboardTasks','getCustomerList','getFunnelData','getTargets','saveTargets'];
let funcInfo = '';
funcs.forEach(f => { funcInfo += f + ': ' + typeof window[f] + '\n'; });
step('关键函数检查', true, funcInfo);
</script>
</body>
</html>
