<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff6b9d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="销售工作台">
<meta name="application-name" content="销售工作台">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>运动场材料销售 · 工作台</title>
<style>
  :root{
    --brand:#ff6b9d;--brand-deep:#e8438a;--brand-soft:#ffe5f0;
    --ink:#0f172a;--muted:#64748b;--bg:#f1f5f9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);
    color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;
    -webkit-font-smoothing:antialiased;
  }
  .splash{padding:20px;max-width:360px;}
  .splash-icon{font-size:64px;margin-bottom:16px;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .splash-title{font-size:24px;font-weight:700;margin-bottom:8px;}
  .splash-sub{font-size:14px;color:#94a3b8;margin-bottom:24px;line-height:1.6;}
  .splash-btn{display:inline-block;padding:12px 28px;background:var(--brand);color:#fff;border-radius:12px;font-size:15px;font-weight:600;text-decoration:none;transition:all .15s;}
  .splash-btn:active{background:var(--brand-deep);transform:scale(.97);}
  .splash-hint{font-size:12px;color:#64748b;margin-top:16px;}
</style>
</head>
<body>
<div class="splash">
  <div class="splash-icon">⚡</div>
  <div class="splash-title">运动场材料销售工作台</div>
  <div class="splash-sub">小伊为你准备 — 项目、客户、回款、报价，一站管理</div>
  <div id="actionArea">
    <a class="splash-btn" href="app.html">打开工作台</a>
    <div class="splash-hint">自动适配手机 / 电脑</div>
  </div>
</div>

<script>
(function(){
  const ua=navigator.userAgent||'';
  const isMobile=/Android|iPhone|iPad|iPod|webOS|BlackBerry/i.test(ua)||
    (navigator.maxTouchPoints>0&&window.innerWidth<1024);
  const isStandalone=window.matchMedia('(display-mode: standalone)').matches||
    navigator.standalone;

  // PWA standalone 模式 → 直接进手机版
  if(isStandalone&&isMobile){
    location.replace('app.html');
    return;
  }

  // 手机浏览器访问 → 手机版
  if(isMobile){
    location.replace('app.html');
    return;
  }

  // 电脑浏览器 → 电脑版
  location.replace('desktop.html');
})();
</script>
</body>
</html>
